name: Swift
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.1
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.3.0
  geolocator: ^14.0.2
  get: ^4.7.3
  intl: ^0.20.3
  latlong2: 0.9.1
  flutter_map_animations: ^0.9.0 
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  image_picker: ^1.2.2
  dotted_border: ^3.1.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

fonts:
  - family: DMSans
    fonts:
      - asset: assets/fonts/DMSans/DMSans_18pt-Regular.ttf
        weight: 400
      - asset: assets/fonts/DMSans/DMSans_18pt-Medium.ttf
        weight: 500
      - asset: assets/fonts/DMSans/DMSans_18pt-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/DMSans/DMSans_18pt-Bold.ttf
        weight: 700
      - asset: assets/fonts/DMSans/DMSans_18pt-ExtraBold.ttf
        weight: 800
